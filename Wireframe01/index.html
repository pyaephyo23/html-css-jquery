<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wireframe01-update</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <header class="header-blk cmn-border">&lt;header&gt;
  </header><!--.header-blk-->
  <div class="middle-blk clearfix">
    <nav class="gnav cmn-border">
      &lt;nav&gt;
    </nav> <!--.gnav-->
    <div class="section-blk clearfix">
      <section class="top-section cmn-border">
        <p>&lt;section&gt;</p>
        <article class="article-blk-1 cmn-border">
          &lt;article&gt;
        </article>
        <aside class="aside-blk cmn-border">
          &lt;aside&gt;
        </aside>
        <aside class="aside-blk cmn-border">
          &lt;aside&gt;
        </aside>
      </section>
      <section class="bottom-section cmn-border">
        <p>&lt;section&gt;</p>
        <article class="article-blk-2 cmn-border">
          &lt;article&gt;
        </article>
        <aside class="aside-blk cmn-border">&lt;aside&gt;</aside>
      </section>
    </div>
  </div><!--.middle-blk-->
  <footer class="footer-blk cmn-border">&lt;footer&gt;
  </footer><!--.footer-blk-->

</body>

</html>
